[package]
name = "novel-ui"
version = "0.1.0"
description = "积木式小说构建器（桌面客户端）"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "novel-ui"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
